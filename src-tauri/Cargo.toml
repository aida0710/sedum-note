[package]
name = "sedum-note"
version = "0.1.0"
description = "End-to-end encrypted notes synced through S3"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sedum_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
# 添付とバックアップを、利用者が選んだ場所に保存するのに使う。
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
