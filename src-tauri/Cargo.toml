[package]
name = "sedum-note"
version = "0.4.0"
description = "End-to-end encrypted notes synced through S3"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sedum_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CI の更新の予行でだけ有効にする。起動したらすぐ自分を更新して終わるアプリになる（src/update_rehearsal.rs）。
update-rehearsal = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
# 添付とバックアップを、利用者が選んだ場所に保存するのに使う。
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
# 同期先（S3 互換ストレージ）への通信を、WebView でなくアプリの側から送るのに使う。WebView から送ると、
# ブラウザと同じ扱いになり、バケットに CORS の設定が要る。
tauri-plugin-http = "2"
# 更新の知らせから、リリースのページをブラウザで開くのに使う。
tauri-plugin-opener = "2.7"
# 期限の通知を出す（Android では、日時を指定して OS に予約する）。
tauri-plugin-notification = "2"

# 常駐（src/resident.rs）のアイコン。Linux では追加のライブラリ（libayatana-appindicator）が要るので、入れない。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }

# アプリが自分を更新する（デスクトップだけ。Android は APK を入れ直す）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
# MCP の窓口（src/mcp_gateway.rs）の HTTP の待ち受け。
tiny_http = "0.12"
tauri-plugin-process = "2.4"
