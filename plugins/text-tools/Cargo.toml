[package]
name = "sedum-note-text-tools"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Example plugin for Sedum Note: sort the selected lines, remove duplicate lines, count characters"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 入力と出力の JSON を読み書きする。標準ライブラリだけで書けるが、見本なので、ふつうの書き方にしている。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 配るファイルを小さくする。
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# このリポジトリのアプリ（src-tauri）とは別の、独立したパッケージ。
[workspace]
