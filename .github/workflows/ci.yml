name: CI

on:
  push:
    branches: [main]
    # v0.1.0 の形のタグを push すると、組み立てたものを GitHub Releases に置く（release の job）。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # npm 10 は、この依存の組み合わせで依存の木を作る途中に落ちる（edgesOut の不具合）。
  NPM_VERSION: "11.6.2"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Start the S3-compatible test server
        run: integration/s3-up.sh
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          E2E_WEBKIT: "1"
      - run: npm run build

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-arguments: ""
          - name: macOS
            runner: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-arguments: --target universal-apple-darwin
          # 古い glibc で組み立てるほど、AppImage が動く Linux の範囲が広がる。
          - name: Linux
            runner: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-arguments: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Install the WebKitGTK build dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb imagemagick
      - run: rustup toolchain install stable --profile minimal && rustup target add ${{ matrix.rust-targets }}
      - run: npx tauri build ${{ matrix.tauri-arguments }}
      # 手元に Mac が無いので、組み立てたアプリを起動して最初の画面を撮り、成果物に入れる。
      - name: Launch the app and capture the first screen
        if: matrix.name == 'macOS'
        run: |
          open src-tauri/target/universal-apple-darwin/release/bundle/macos/memo-app.app
          sleep 20
          screencapture -x mac-first-screen.png
          pgrep -x memo-app
      # Linux も同じく、組み立てた AppImage を画面の無い X（Xvfb）で起動して最初の画面を撮る。
      - name: Launch the app and capture the first screen
        if: matrix.name == 'Linux'
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage')
          chmod +x "$appimage"
          Xvfb :99 -screen 0 1280x820x24 &
          export DISPLAY=:99
          # ランナーに FUSE が無いので、AppImage を展開してから起動する。
          export APPIMAGE_EXTRACT_AND_RUN=1
          sleep 2
          "$appimage" &
          sleep 20
          import -window root linux-first-screen.png
          pgrep -f memo-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memo-app-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            mac-first-screen.png
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            linux-first-screen.png
          if-no-files-found: error

  android:
    name: Android
    needs: checks
    runs-on: ubuntu-latest
    env:
      # src-tauri/gen/android を作ったときと同じ NDK。
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal && rustup target add aarch64-linux-android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      # 全 ABI を入れると 1 GB を超えるので、今のスマホの 64 ビット ARM だけにする。
      # 配布用の鍵で署名し、入れたアプリを次の版で上書きできるようにする。鍵は Actions の
      # シークレットにあり、フォークからの PR では渡らないので、そのときは署名せずに作る。
      - name: Build the signed release APK
        env:
          MEMO_ANDROID_KEYSTORE_BASE64: ${{ secrets.MEMO_ANDROID_KEYSTORE_BASE64 }}
          MEMO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MEMO_ANDROID_KEYSTORE_PASSWORD }}
          MEMO_ANDROID_KEY_ALIAS: ${{ secrets.MEMO_ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$MEMO_ANDROID_KEYSTORE_BASE64" ]; then
            export MEMO_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
            printf '%s' "$MEMO_ANDROID_KEYSTORE_BASE64" | base64 -d > "$MEMO_ANDROID_KEYSTORE_PATH"
          fi
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memo-app-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  # Web 版。main の画面を GitHub Pages（https://aida0710.github.io/memo-app/）に置く。
  pages:
    name: Web (GitHub Pages)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run build -- --base /memo-app/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # タグの push のときだけ、組み立てたインストーラーと APK を GitHub Releases に置く。
  # リリースノートは docs/releases/<タグ>.md。
  release:
    name: GitHub Release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check that the tag matches the app version
        run: |
          app_version="v$(jq -r .version src-tauri/tauri.conf.json)"
          test "$app_version" = "$GITHUB_REF_NAME" || {
            echo "the tag $GITHUB_REF_NAME does not match the app version $app_version" >&2
            exit 1
          }
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: built
      - name: Collect the release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-files
          # 成果物の中のフォルダの形は、upload-artifact が複数のパスの共通の親から決めるので OS ごとに違う。
          take() {
            found=$(find "built/$1" -type f -name "$2")
            test "$(printf '%s\n' "$found" | grep -c .)" = 1 || { echo "expected one $2 in $1, found: $found" >&2; exit 1; }
            cp "$found" "release-files/$3"
          }
          take memo-app-Windows '*-setup.exe' "memo-app_${version}_windows-x64-setup.exe"
          take memo-app-Windows '*.msi' "memo-app_${version}_windows-x64.msi"
          take memo-app-macOS '*.dmg' "memo-app_${version}_macos-universal.dmg"
          take memo-app-Android '*.apk' "memo-app_${version}_android-arm64.apk"
          take memo-app-Linux '*.AppImage' "memo-app_${version}_linux-x86_64.AppImage"
          take memo-app-Linux '*.deb' "memo-app_${version}_linux-amd64.deb"
          take memo-app-Linux '*.rpm' "memo-app_${version}_linux-x86_64.rpm"
          (cd release-files && sha256sum * > SHA256SUMS)
          ls -l release-files
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "memo-app $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
