name: CI

on:
  push:
    branches: [main]
    # v0.1.0 の形のタグを push すると、組み立てたものを GitHub Releases に置く（release の job）。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # npm 10 は、この依存の組み合わせで依存の木を作る途中に落ちる（edgesOut の不具合）。
  NPM_VERSION: "11.6.2"

# main への push から 5 分ほどで結果が出るようにしてある。そのために、
# - 検査・画面の試験・各 OS のビルドを、互いを待たせずに並べて流す（リリースは全部が通ってから）
# - Rust と Gradle の組み立てた結果を、次の回へ持ち越す（キャッシュ）
# - 依存の入ったコンテナイメージを使い、実行のたびに apt などで取ってこない（取得が遅い・固まることがある）
# - 時間のかかる確認（macOS の universal のビルド、更新の予行）は、リリースのタグと手で起動したときだけ流す
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Start the S3-compatible test server
        run: integration/s3-up.sh
      - name: Start the WebDAV test server
        run: integration/webdav-up.sh
      - run: npm run test:integration
      - run: npm run build
      # MCP は PC 版にだけ同梱する。Web 版のビルドに MCP のコードが入っていないことを確かめる。
      - name: Check that the web build does not include MCP
        run: |
          if grep -rlE 'replace_note_body|mcp_start' dist; then
            echo "the web build includes MCP code" >&2
            exit 1
          fi

  # 画面の試験。macOS のアプリは WebKit（WKWebView）で動くので、Chromium と WebKit の両方で流す。
  # CI を 5 分ほどで終えるため、ブラウザごとに分け、さらに試験を 3 つに分けて同時に流す（WebKit を 1 つの job で
  # 流すと、211 件で 10 分を超えた）。
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Start the S3-compatible test server
        run: integration/s3-up.sh
      # ブラウザとその依存が入った Playwright の公式のイメージの中で流す（ランナーの上で入れると、
      # 取得に時間がかかり、固まることがある）。イメージの版は、入れてある @playwright/test に合わせる。
      - name: Run the tests in the Playwright image
        run: |
          playwright_version=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --network host --ipc=host -v "$PWD:$PWD" -w "$PWD" -e CI -e E2E_WEBKIT=1 \
            "mcr.microsoft.com/playwright:v$playwright_version-noble" \
            npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

  desktop:
    name: Desktop (${{ matrix.name }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-arguments: ""
          # 配布するのは Intel と Apple シリコンの両方で動く universal。2 つ分を組み立てるので時間がかかる。
          # ふだんの push では Apple シリコンの分だけを組み立て、universal はリリースのタグと手で起動したときに作る。
          - name: macOS
            runner: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-arguments: --target ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'universal-apple-darwin' || 'aarch64-apple-darwin' }}
          # 古い glibc で組み立てるほど、AppImage が動く Linux の範囲が広がる。
          # 組み立てと起動は、依存を入れてあるイメージの中で行う（scripts/ci/in-linux-image.sh）。
          - name: Linux
            runner: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-arguments: ""
    runs-on: ${{ matrix.runner }}
    env:
      # .github/workflows/ci-image.yml が作って置くイメージ。
      LINUX_BUILD_IMAGE: ghcr.io/${{ github.repository_owner }}/sedum-note-ci-linux:latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Pull the Linux build image
        if: matrix.name == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull -q "$LINUX_BUILD_IMAGE"
      - run: rustup toolchain install stable --profile minimal && rustup target add ${{ matrix.rust-targets }}
      # 依存のクレートを組み立てた結果を、次の回へ持ち越す。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      # キャッシュには、前の回に組み立てたアプリの束（bundle）も残っている。消さないと、下の手順の
      # `target/*-apple-darwin` などに前の回の束も当たる（タグの回が作った universal の束は、中の実行ファイルだけが
      # キャッシュから外れていて、起動の手順が「実行ファイルが無い」で落ちた）。
      - name: Remove app bundles restored from the cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
      # Linux は、依存を入れてあるイメージの中で組み立てる。
      - name: Build the app
        if: matrix.name != 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/ci/build-app.sh ${{ matrix.tauri-arguments }}
      - name: Build the app in the Linux build image
        if: matrix.name == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/ci/in-linux-image.sh scripts/ci/build-app.sh ${{ matrix.tauri-arguments }}

      # 手元に Mac が無いので、組み立てたアプリを起動して最初の画面を撮り、成果物に入れる。
      - name: Launch the app and capture the first screen
        if: matrix.name == 'macOS'
        run: |
          open src-tauri/target/*-apple-darwin/release/bundle/macos/"Sedum Note.app"
          sleep 20
          screencapture -x mac-first-screen.png
          pgrep -x sedum-note
      # ダウンロードしたものと同じ扱い（quarantine の印）にしたときに、Gatekeeper がどう判定するかを残す。
      # 束が署名されていない Apple シリコンのアプリは「壊れている」と断られ、「このまま開く」も出ない。
      # 仮の署名（tauri.conf.json の signingIdentity "-"）で束が封じてあることを codesign で確かめる。
      # 公証は無いので spctl は断る（利用者は「このまま開く」で開く）。
      - name: Check the signature Gatekeeper sees
        if: matrix.name == 'macOS'
        run: |
          dmg=$(find src-tauri/target/*-apple-darwin/release/bundle/dmg -name '*.dmg')
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
          cp -R "$mount/Sedum Note.app" "$RUNNER_TEMP/Sedum Note.app"
          hdiutil detach "$mount"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$RUNNER_TEMP/Sedum Note.app"
          codesign -dv --verbose=2 "$RUNNER_TEMP/Sedum Note.app" 2>&1 | tee mac-signature.txt
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Sedum Note.app" 2>&1 | tee -a mac-signature.txt
          codesign --verify --deep --strict "$RUNNER_TEMP/Sedum Note.app"
          spctl -a -vv --type execute "$RUNNER_TEMP/Sedum Note.app" 2>&1 | tee -a mac-signature.txt || true
      # Linux も同じく、組み立てた AppImage を画面の無い X（Xvfb）で起動して最初の画面を撮る。
      - name: Launch the app and capture the first screen
        if: matrix.name == 'Linux'
        # ランナーは shell の最初の語を PATH から探すので、スクリプトは sh に渡して呼ぶ。
        shell: sh scripts/ci/in-linux-image.sh bash -e {0}
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage')
          chmod +x "$appimage"
          Xvfb :99 -screen 0 1280x820x24 &
          export DISPLAY=:99
          # ランナーに FUSE が無いので、AppImage を展開してから起動する。
          export APPIMAGE_EXTRACT_AND_RUN=1
          sleep 2
          "$appimage" > linux-app.log 2>&1 &
          # 展開（約 80 MB）と最初の描画を待つ。
          sleep 40
          # ImageMagick の import では WebKitGTK の描いた中身が写らず黒くなるので、X の画面を直接撮る。
          ffmpeg -loglevel error -y -f x11grab -video_size 1280x820 -i :99 -frames:v 1 linux-first-screen.png
          cat linux-app.log
          pgrep -x sedum-note
      # 更新の予行。古いバージョン（0.0.1）のアプリを作り、上で組み立てた AppImage へ実際に更新させる。
      # 更新元はこのランナーの中の HTTP サーバーにし、latest.json はリリースと同じスクリプトで書く。
      # 古いバージョンには、起動したらすぐ更新して終わる仕掛け（update-rehearsal）を入れる。
      # 署名の検証は配布するものと同じ公開鍵で行うので、署名が合わなければここで落ちる。
      # 古いバージョンをもう 1 回組み立てるので、リリースのタグと手で起動したときだけ流す
      # （落ちたら release の job が走らないので、更新できないリリースは出ない）。
      - name: Rehearse an update from an older version
        if: matrix.name == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: sh scripts/ci/in-linux-image.sh bash -e {0}
        run: |
          set -eu
          bundle=src-tauri/target/release/bundle/appimage
          new_appimage=$(find "$bundle" -name '*.AppImage')
          if [ ! -f "$new_appimage.sig" ]; then
            echo "the build is not signed (no signing key in this run); skipping the rehearsal"
            exit 0
          fi
          mkdir -p update-rehearsal/served update-rehearsal/installed
          cp "$new_appimage" update-rehearsal/served/new.AppImage
          cp "$new_appimage.sig" update-rehearsal/served/new.AppImage.sig
          node scripts/release/writeUpdateManifest.mjs --version "$(jq -r .version src-tauri/tauri.conf.json)" \
            --base-url http://127.0.0.1:8765 --directory update-rehearsal/served --output update-rehearsal/served/latest.json \
            linux-x86_64-appimage=new.AppImage
          cat update-rehearsal/served/latest.json
          # 配布する AppImage を上書きしないよう、よけておいてから古いバージョンを組み立てる。
          mv "$bundle" "$bundle.release"
          npx tauri build --features update-rehearsal --bundles appimage --config '{"version":"0.0.1","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["http://127.0.0.1:8765/latest.json"],"dangerousInsecureTransportProtocol":true}}}'
          mv "$(find "$bundle" -name '*.AppImage')" update-rehearsal/installed/sedum-note.AppImage
          rm -rf "$bundle"
          mv "$bundle.release" "$bundle"
          (cd update-rehearsal/served && python3 -m http.server 8765 --bind 127.0.0.1 > ../server.log 2>&1 &)
          Xvfb :98 -screen 0 1280x820x24 &
          sleep 2
          chmod +x update-rehearsal/installed/sedum-note.AppImage
          DISPLAY=:98 APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 update-rehearsal/installed/sedum-note.AppImage || {
            echo "the old version could not update itself" >&2
            cat update-rehearsal/server.log
            exit 1
          }
          cat update-rehearsal/server.log
          # 入れてあった AppImage が、新しいバージョンのものと同じ中身に入れ替わっている。
          cmp update-rehearsal/installed/sedum-note.AppImage update-rehearsal/served/new.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sedum-note-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/*-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
            mac-first-screen.png
            mac-signature.txt
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            linux-first-screen.png
            linux-app.log
          if-no-files-found: error

  # 確認専用の Windows のビルド。WebView2 の DevTools を 127.0.0.1:9222 に開き、組み立てたアプリを
  # 外から操作して確かめる（scripts/app-checks/syncWithApp.mjs）。配布するビルドには DevTools の口を
  # 入れない（動いている間、このマシンのほかのプロセスから復号したメモが読めてしまう）。
  # WebView2 157 は、アプリが引数を渡すと WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS を使わないので、
  # 窓の設定（additionalBrowserArgs）で渡す。手で起動したときだけ作り、リリースには載せない。
  windows-check-build:
    name: Windows check build (DevTools)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal
      - name: Build with DevTools on 127.0.0.1:9222
        shell: bash
        run: |
          window=$(jq -c '.app.windows[0] + {additionalBrowserArgs: "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222"}' src-tauri/tauri.conf.json)
          npx tauri build --no-bundle --config "{\"app\":{\"windows\":[$window]}}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sedum-note-Windows-check
          path: src-tauri/target/release/sedum-note.exe
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # src-tauri/gen/android を作ったときと同じ NDK。
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: rustup toolchain install stable --profile minimal && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: android
      # Gradle が取ってきたものと組み立てた結果を、次の回へ持ち越す。
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      # 全 ABI を入れると 1 GB を超えるので、今のスマホの 64 ビット ARM だけにする。
      # 配布用の鍵で署名し、入れたアプリを次の版で上書きできるようにする。鍵は Actions の
      # シークレットにあり、フォークからの PR では渡らないので、そのときは署名せずに作る。
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          fi
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sedum-note-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  # Web 版。リリースのタグのときだけ、その画面を GitHub Pages（https://aida0710.github.io/sedum-note/）に置く。
  # main の push ごとに置くと、保存の形式を変えている途中の画面が、使っている人の手元のデータに当たる。
  pages:
    name: Web (GitHub Pages)
    needs: [checks, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run build -- --base /sedum-note/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # タグの push のときだけ、組み立てたインストーラーと APK、アプリの更新用の latest.json を GitHub Releases に置く。
  # リリースノートは docs/releases/<タグ>.md。
  release:
    name: GitHub Release
    needs: [checks, e2e, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check that the tag matches the app version
        run: |
          app_version="v$(jq -r .version src-tauri/tauri.conf.json)"
          test "$app_version" = "$GITHUB_REF_NAME" || {
            echo "the tag $GITHUB_REF_NAME does not match the app version $app_version" >&2
            exit 1
          }
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: built
      - name: Collect the release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-files
          # 成果物の中のフォルダの形は、upload-artifact が複数のパスの共通の親から決めるので OS ごとに違う。
          take() {
            found=$(find "built/$1" -type f -name "$2")
            test "$(printf '%s\n' "$found" | grep -c .)" = 1 || { echo "expected one $2 in $1, found: $found" >&2; exit 1; }
            cp "$found" "release-files/$3"
          }
          # アプリが自分を更新するのに使うファイル。署名（.sig）は latest.json に書くので、signatures に分けて置く。
          mkdir signatures
          take_signed() {
            take "$1" "$2" "$3"
            signature=$(find "built/$1" -type f -name "$2.sig")
            test "$(printf '%s\n' "$signature" | grep -c .)" = 1 || { echo "expected one $2.sig in $1, found: $signature" >&2; exit 1; }
            cp "release-files/$3" "signatures/$3"
            cp "$signature" "signatures/$3.sig"
          }
          take_signed sedum-note-Windows '*-setup.exe' "sedum-note_${version}_windows-x64-setup.exe"
          take_signed sedum-note-Windows '*.msi' "sedum-note_${version}_windows-x64.msi"
          take sedum-note-macOS '*.dmg' "sedum-note_${version}_macos-universal.dmg"
          take_signed sedum-note-macOS '*.app.tar.gz' "sedum-note_${version}_macos-universal.app.tar.gz"
          take sedum-note-Android '*.apk' "sedum-note_${version}_android-arm64.apk"
          take_signed sedum-note-Linux '*.AppImage' "sedum-note_${version}_linux-x86_64.AppImage"
          take_signed sedum-note-Linux '*.deb' "sedum-note_${version}_linux-amd64.deb"
          take_signed sedum-note-Linux '*.rpm' "sedum-note_${version}_linux-x86_64.rpm"
          (cd release-files && sha256sum * > SHA256SUMS)
          # 入れてあるアプリは、リリースの latest.json を見て、自分の入れ方（インストーラーの種類）に合うファイルで更新する。
          # 入れ方の付かないキーは、入れ方が分からないアプリのためのもの。
          node scripts/release/writeUpdateManifest.mjs --version "$version" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --directory signatures --output release-files/latest.json \
            "windows-x86_64-nsis=sedum-note_${version}_windows-x64-setup.exe" \
            "windows-x86_64-msi=sedum-note_${version}_windows-x64.msi" \
            "windows-x86_64=sedum-note_${version}_windows-x64-setup.exe" \
            "darwin-aarch64-app=sedum-note_${version}_macos-universal.app.tar.gz" \
            "darwin-x86_64-app=sedum-note_${version}_macos-universal.app.tar.gz" \
            "darwin-aarch64=sedum-note_${version}_macos-universal.app.tar.gz" \
            "darwin-x86_64=sedum-note_${version}_macos-universal.app.tar.gz" \
            "linux-x86_64-appimage=sedum-note_${version}_linux-x86_64.AppImage" \
            "linux-x86_64-deb=sedum-note_${version}_linux-amd64.deb" \
            "linux-x86_64-rpm=sedum-note_${version}_linux-x86_64.rpm" \
            "linux-x86_64=sedum-note_${version}_linux-x86_64.AppImage"
          ls -l release-files
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "Sedum Note $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
